<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0b0c">
<title>Bangkok Ice Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
canvas#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#08090a;image-rendering:pixelated}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:2px 2px 0 #000}
.panel{background:rgba(13,14,15,.88);border:2px solid #484a4b;box-shadow:3px 3px 0 rgba(0,0,0,.75)}
#mission{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));width:230px;padding:10px 12px;font-size:16px;font-weight:900;line-height:1.35}
#mission .title{font-size:17px;line-height:1.15;padding-bottom:8px;border-bottom:1px solid #7d7d7d;margin-bottom:8px}
.amber{color:#e6bc72}.cyan{color:#8fe8ff}.green{color:#82db65}.red{color:#ff6a5c}
#topRight{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));display:grid;gap:6px;text-align:right;font-weight:900}
#temp,#money{padding:7px 12px;min-width:132px;font-size:22px}
#minimapWrap{position:absolute;left:12px;top:calc(192px + env(safe-area-inset-top));width:165px;height:165px;padding:5px}
#minimap{width:100%;height:100%;image-rendering:pixelated}
#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
.pad{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto}
.btn{position:absolute;width:54px;height:54px;border:2px solid rgba(255,255,255,.72);background:rgba(10,10,11,.54);color:#fff;font:bold 22px monospace;display:grid;place-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.65);border-radius:5px}
.btn.on{background:rgba(255,255,255,.22);transform:translate(1px,1px)}
.u{left:48px;top:0}.d{left:48px;bottom:0}.l{left:0;top:48px}.r{right:0;top:48px}
#brake{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(184,47,39,.4);color:#fff;font:bold 11px monospace;letter-spacing:.08em;pointer-events:auto;box-shadow:3px 3px 0 #000}
#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:10px 14px;font-size:12px;font-weight:900;opacity:0;transition:opacity .12s;white-space:nowrap}
#rotate{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:9px;opacity:.55}
@media (max-width:520px){#mission{width:188px;font-size:12px}#mission .title{font-size:13px}#minimapWrap{top:calc(164px + env(safe-area-inset-top));width:128px;height:128px}#temp,#money{min-width:102px;font-size:16px;padding:6px 8px}}
@media(pointer:fine){#controls{opacity:.28}.pad:hover,#brake:hover{opacity:1}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="mission" class="panel">
    <div class="title">DELIVER ICE<br>TO COOL SPOT</div>
    <div id="time" class="amber">TIME: 02:45</div>
    <div id="ice">ICE LEFT: 8/8</div>
    <div id="melt">MELT: 0%</div>
  </div>
  <div id="minimapWrap" class="panel"><canvas id="minimap" width="155" height="155"></canvas></div>
  <div id="topRight"><div id="temp" class="panel amber">☀ 40°C</div><div id="money" class="panel green">$215</div></div>
  <div id="message" class="panel"></div>
</div>
<div id="controls">
  <div class="pad">
    <button class="btn u" data-k="ArrowUp">▲</button><button class="btn d" data-k="ArrowDown">▼</button>
    <button class="btn l" data-k="ArrowLeft">◀</button><button class="btn r" data-k="ArrowRight">▶</button>
  </div>
  <button id="brake">BRAKE</button>
</div>

}
function drawTrail(cam){p.trail.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life/1.2);ctx.fillStyle='#9beaff';const x=(q.x-cam.x)*zoom,y=(q.y-cam.y)*zoom,r=q.size*zoom;ctx.fillRect(x-r/2,y-r/2,r,r)});ctx.globalAlpha=1}
function drawTarget(cam){const t=currentTarget(),x=(t.x-cam.x)*zoom,y=(t.y-cam.y)*zoom,r=(27+Math.sin(performance.now()/150)*4)*zoom;ctx.strokeStyle='#ffd554';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.2;ctx.fillStyle='#ffd554';ctx.beginPath();ctx.arc(x,y,16*zoom,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff5cf';ctx.font=`900 ${10*zoom}px monospace`;ctx.textAlign='center';ctx.fillText('DROP',x,y-r-7)}
const rain=Array.from({length:90},(_,i)=>({x:(i*79)%997,y:(i*137)%997,s:140+(i%11)*17}));
function drawRain(now){ctx.globalAlpha=.15;ctx.strokeStyle='#b9ecff';ctx.lineWidth=1;for(const r of rain){const x=(r.x+now*r.s*.00018*W)%W,y=(r.y+now*r.s*.0005*H)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+11);ctx.stroke()}ctx.globalAlpha=1}
function render(now){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#08090a';ctx.fillRect(0,0,W,H);if(!tileReady)return;let cam=camera();if(shake){cam={x:cam.x+(Math.random()-.5)*shake/zoom,y:cam.y+(Math.random()-.5)*shake/zoom};shake*=.82;if(shake<.1)shake=0}drawMap(cam);drawTrail(cam);drawTarget(cam);traffic.forEach(t=>drawCar(t,cam));drawBike(cam);drawRain(now);const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

function updateHUD(speed){const mm=String(Math.floor(p.timer/60)).padStart(2,'0'),ss=String(Math.floor(p.timer%60)).padStart(2,'0');document.getElementById('time').textContent=`TIME: ${mm}:${ss}`;document.getElementById('ice').textContent=`ICE LEFT: ${p.ice}/8`;const me=document.getElementById('melt');me.textContent=`MELT: ${Math.floor(p.melt)}%`;me.className=p.melt>70?'red':p.melt>40?'amber':'';document.getElementById('money').textContent='$'+p.money;drawMini()}
function drawMini(){const w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);mctx.fillStyle='#1b1b1b';mctx.fillRect(0,0,w,h);const sx=w/TILE_W,sy=h/TILE_H;mctx.fillStyle='#525659';roads.forEach(r=>mctx.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy));const ly=mod(p.y,TILE_H);mctx.fillStyle='#ff5145';mctx.beginPath();mctx.arc(p.x*sx,ly*sy,4,0,Math.PI*2);mctx.fill();const t=currentTarget(),ty=mod(t.y,TILE_H);mctx.fillStyle='#ffd554';mctx.beginPath();mctx.arc(t.x*sx,ty*sy,4,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#ddd';mctx.strokeRect(.5,.5,w-1,h-1)}

let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt,now);render(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
