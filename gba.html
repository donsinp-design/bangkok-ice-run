<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090a0b">
<title>Bangkok Ice Run GBA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;background:#08090a}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:2px 2px #000}
.panel{background:rgba(8,9,10,.88);border:2px solid #55585b;box-shadow:3px 3px #000}
#mission{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));width:188px;padding:9px 10px;font-size:12px;font-weight:900;line-height:1.35}
#mission .title{font-size:13px;line-height:1.08;padding-bottom:7px;border-bottom:1px solid #777;margin-bottom:7px}
.amber{color:#e9bc72}.red{color:#ff695d}
#topRight{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));display:grid;gap:8px;justify-items:end;text-align:right;font-weight:900;filter:drop-shadow(2px 2px 0 #000)}
#hp{display:flex;align-items:center;gap:6px;font-size:13px}
#hpbar{display:flex;gap:2px}
.hpseg{display:block;width:13px;height:7px;background:#e84444}
.hpseg.off{background:#542828}
#money{font-size:19px;color:#8be367;letter-spacing:.03em}
#minimapWrap{position:absolute;left:12px;top:calc(164px + env(safe-area-inset-top));width:126px;height:126px;padding:4px}
#minimap{width:100%;height:100%;image-rendering:pixelated}
#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:8px 11px;font-size:11px;font-weight:900;opacity:0;transition:opacity .12s}
#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
.joystick{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;border:2px solid rgba(255,255,255,.30);background:rgba(8,9,10,.25);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin-left:-26px;margin-top:-26px;border-radius:50%;background:rgba(210,218,220,.58);border:2px solid rgba(255,255,255,.50);box-shadow:2px 2px 0 rgba(0,0,0,.45);transform:translate(0,0)}
#brake{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(177,47,39,.47);color:#fff;font:bold 11px monospace;letter-spacing:.08em;pointer-events:auto;box-shadow:3px 3px #000;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="mission" class="panel">
    <div class="title">DELIVER ICE<br>TO COOL SPOT</div>
    <div id="time" class="amber">TIME: 02:45</div>
    <div id="ice">ICE LEFT: 8/8</div>
  </div>

  <div id="minimapWrap" class="panel">
    <canvas id="minimap" width="124" height="124"></canvas>
  </div>

  <div id="topRight">
    <div id="hp">
      <span>HP</span>
      <div id="hpbar">
        <i class="hpseg"></i><i class="hpseg"></i><i class="hpseg"></i>
        <i class="hpseg"></i><i class="hpseg"></i><i class="hpseg"></i>
      </div>
    </div>
    <div id="money">฿215</div>
  </div>

  <div id="message" class="panel"></div>
</div>

<div id="controls">
  <div class="joystick" id="joystick"><div id="stick"></div></div>
  <button id="brake">BRAKE</button>
</div>

<script src="gba.js"></script>
</body>
</html>
