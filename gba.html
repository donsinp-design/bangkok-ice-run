<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#090a0b"><title>Bangkok Ice Run GBA</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;background:#08090a}#hud{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:2px 2px #000}.panel{background:rgba(8,9,10,.9);border:2px solid #55585b;box-shadow:3px 3px #000}#mission{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));width:188px;padding:9px 10px;font-size:12px;font-weight:900;line-height:1.35}#mission .title{font-size:13px;line-height:1.08;padding-bottom:7px;border-bottom:1px solid #777;margin-bottom:7px}.amber{color:#e9bc72}.green{color:#82df67}.red{color:#ff695d}#topRight{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));display:grid;gap:6px;text-align:right;font-weight:900}#temp,#money{padding:6px 8px;min-width:96px;font-size:16px}#minimapWrap{position:absolute;left:12px;top:calc(164px + env(safe-area-inset-top));width:126px;height:126px;padding:4px}#minimap{width:100%;height:100%;image-rendering:pixelated}#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:8px 11px;font-size:11px;font-weight:900;opacity:0;transition:opacity .12s}#controls{position:fixed;inset:0;z-index:20;pointer-events:none}.pad{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:138px;height:138px;display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;pointer-events:auto}.btn{width:46px;height:46px;padding:0;margin:0;border:2px solid rgba(255,255,255,.72);background:rgba(8,9,10,.64);color:#fff;font:bold 18px monospace;display:grid;place-items:center;box-shadow:2px 2px #000;border-radius:4px;touch-action:none}.btn.on{background:rgba(255,255,255,.22);transform:translate(1px,1px)}.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}#brake{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(177,47,39,.47);color:#fff;font:bold 11px monospace;letter-spacing:.08em;pointer-events:auto;box-shadow:3px 3px #000;touch-action:none}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="mission" class="panel"><div class="title">DELIVER ICE<br>TO COOL SPOT</div><div id="time" class="amber">TIME: 02:45</div><div id="ice">ICE LEFT: 8/8</div><div id="melt">MELT: 0%</div></div><div id="minimapWrap" class="panel"><canvas id="minimap" width="124" height="124"></canvas></div><div id="topRight"><div id="temp" class="panel amber">☀ 40°C</div><div id="money" class="panel green">$215</div></div><div id="message" class="panel"></div></div><div id="controls"><div class="pad"><button class="btn u" data-k="ArrowUp">▲</button><button class="btn l" data-k="ArrowLeft">◀</button><button class="btn r" data-k="ArrowRight">▶</button><button class="btn d" data-k="ArrowDown">▼</button></div><button id="brake">BRAKE</button></div><script src="gba.js"></script></body></html>
