<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08090a">
<title>Bangkok Ice Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#viewport{position:fixed;inset:0;overflow:hidden;background:#08090a}
#scene{position:absolute;width:1536px;height:682px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;inset:0;width:1536px;height:682px;display:block;pointer-events:none;user-select:none}
#roadPatch{position:absolute;left:690px;top:126px;width:74px;height:446px;background-image:url('reference.svg');background-size:1536px 682px;background-position:-620px -126px;background-repeat:no-repeat;z-index:2}
#target{position:absolute;width:52px;height:52px;border:4px solid #75e8ff;border-radius:50%;box-shadow:0 0 0 5px rgba(117,232,255,.18),0 0 22px rgba(117,232,255,.75);z-index:5;transform:translate(-50%,-50%)}
#target:after{content:"DROP";position:absolute;left:50%;top:-23px;transform:translateX(-50%);font:bold 12px monospace;color:#d9f8ff;text-shadow:2px 2px #000}
#bike{position:absolute;width:42px;height:74px;z-index:8;transform-origin:50% 58%;filter:drop-shadow(3px 5px 1px rgba(0,0,0,.55))}
.wheel{position:absolute;left:15px;width:12px;height:18px;background:#121212;border:3px solid #050505}
.w1{top:0}.w2{bottom:0}
.body{position:absolute;left:8px;top:15px;width:26px;height:42px;background:#d6d4cf;border:3px solid #272727}
.seat{position:absolute;left:10px;top:31px;width:22px;height:15px;background:#1d2225}
.red{position:absolute;left:11px;top:20px;width:20px;height:18px;background:#d64538}
.helmet{position:absolute;left:10px;top:5px;width:22px;height:22px;border-radius:50%;background:#24272b;border:3px solid #0c0c0d}
.visor{position:absolute;left:13px;top:10px;width:16px;height:6px;background:#7e9ba5}
.icebox{position:absolute;left:4px;top:45px;width:34px;height:24px;background:#c9f2ff;border:3px solid #539ec8;color:#296391;font:bold 10px monospace;display:grid;place-items:center}
.handle{position:absolute;left:2px;top:20px;width:38px;height:5px;background:#1d1d1d}
.cube{position:absolute;width:8px;height:8px;background:#9be9ff;border:2px solid #dffaff;z-index:4;pointer-events:none}
#dynamicHud{position:absolute;z-index:10;left:34px;top:108px;width:208px;height:108px;background:#181818;color:#eee;padding:4px 9px;font:bold 17px monospace;line-height:1.38;text-shadow:1px 1px #000}
#dynamicHud .amber{color:#e5bd72}
#money{position:absolute;z-index:10;right:32px;top:87px;width:165px;height:50px;background:#151515;color:#79d95e;font:bold 30px monospace;display:grid;place-items:center;text-shadow:2px 2px #000}
#live{position:fixed;z-index:30;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.4);padding:7px 9px;font:bold 10px monospace;letter-spacing:.08em;pointer-events:none}
#controls{position:fixed;inset:0;z-index:25;pointer-events:none}
.pad{position:absolute;left:14px;bottom:calc(44px + env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto}
.btn{position:absolute;width:54px;height:54px;border:2px solid rgba(255,255,255,.84);background:rgba(7,8,9,.60);color:#fff;font:bold 22px monospace;display:grid;place-items:center;box-shadow:2px 2px #000}
.btn.on{background:rgba(255,255,255,.24)}
.u{left:48px;top:0}.d{left:48px;bottom:0}.l{left:0;top:48px}.r{right:0;top:48px}
#brake{position:absolute;right:18px;bottom:calc(52px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(205,54,44,.48);color:#fff;font:bold 11px monospace;letter-spacing:.08em;pointer-events:auto}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:#111;border:2px solid #ddd;padding:9px 12px;font:bold 11px monospace;opacity:0;transition:opacity .15s}
@media(pointer:fine){#controls{opacity:.3}.pad:hover,#brake:hover{opacity:1}}
</style>
</head>
<body>
<div id="viewport">
  <div id="scene">
    <img id="bg" src="reference.svg" alt="">
    <div id="roadPatch"></div>
    <div id="dynamicHud"><span class="amber" id="time">TIME: 02:45</span><br><span id="ice">ICE LEFT: 6/8</span><br><span id="melt">MELT: 24%</span></div>
    <div id="money">$215</div>
    <div id="target"></div>
    <div id="bike">
      <div class="wheel w1"></div><div class="wheel w2"></div><div class="body"></div><div class="red"></div><div class="seat"></div><div class="helmet"></div><div class="visor"></div><div class="handle"></div><div class="icebox">ICE</div>
    </div>
  </div>
</div>
<div id="controls">
  <div class="pad">
    <button class="btn u" data-k="ArrowUp">▲</button>
    <button class="btn d" data-k="ArrowDown">▼</button>
    <button class="btn l" data-k="ArrowLeft">◀</button>
    <button class="btn r" data-k="ArrowRight">▶</button>
  </div>
  <button id="brake">BRAKE</button>
</div>
<div id="live">GAME LIVE · NO START SCREEN</div>
<div id="toast"></div>
<script>
(function(){
"use strict";
const scene=document.getElementById("scene"),bike=document.getElementById("bike"),target=document.getElementById("target"),timeEl=document.getElementById("time"),iceEl=document.getElementById("ice"),meltEl=document.getElementById("melt"),moneyEl=document.getElementById("money"),toast=document.getElementById("toast");
let scale=1,offsetX=0,offsetY=0;
function fit(){scale=Math.min(innerWidth/1536,innerHeight/682);offsetX=(innerWidth-1536*scale)/2;offsetY=(innerHeight-682*scale)/2;scene.style.transform="translate("+offsetX+"px,"+offsetY+"px) scale("+scale+")"}
addEventListener("resize",fit);fit();

const keys=Object.create(null);
addEventListener("keydown",e=>{keys[e.key]=true;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll(".btn").forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add("on")};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove("on")};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);
});
const brake=document.getElementById("brake");
brake.addEventListener("pointerdown",e=>{e.preventDefault();keys[" "]=true});
["pointerup","pointercancel","pointerleave"].forEach(t=>brake.addEventListener(t,e=>{e.preventDefault();keys[" "]=false}));

const state={x:724,y:238,vx:0,vy:0,angle:0,timer:165,melt:24,ice:6,money:215,drop:0,lastCube:0,hit:0};
const targets=[{x:740,y:70},{x:820,y:620},{x:645,y:350}];
const obstacles=[{x:475,y:25,w:125,h:160},{x:448,y:455,w:130,h:210},{x:875,y:20,w:145,h:175}];
function collide(x,y,r,o){return x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h}
function showToast(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.opacity=0,900)}
function resetTarget(){const t=targets[state.drop%targets.length];target.style.left=t.x+"px";target.style.top=t.y+"px"}
resetTarget();

function makeCube(){
  const c=document.createElement("div");c.className="cube";c.style.left=(state.x-4)+"px";c.style.top=(state.y+20)+"px";scene.appendChild(c);
  setTimeout(()=>c.remove(),1300);
}

let last=performance.now();
function tick(now){
  const dt=Math.min(.033,(now-last)/1000||0);last=now;
  let ix=0,iy=0;if(keys.ArrowLeft||keys.a||keys.A)ix--;if(keys.ArrowRight||keys.d||keys.D)ix++;if(keys.ArrowUp||keys.w||keys.W)iy--;if(keys.ArrowDown||keys.s||keys.S)iy++;
  if(ix||iy){const m=Math.hypot(ix,iy);ix/=m;iy/=m;const a=keys[" "]?120:300;state.vx+=ix*a*dt;state.vy+=iy*a*dt;state.angle=Math.atan2(iy,ix)+Math.PI/2}
  const drag=Math.pow(keys[" "]?.025:.16,dt);state.vx*=drag;state.vy*=drag;
  const max=keys[" "]?65:170,s=Math.hypot(state.vx,state.vy);if(s>max){state.vx=state.vx/s*max;state.vy=state.vy/s*max}
  let nx=state.x+state.vx*dt,ny=state.y+state.vy*dt;
  if(nx<430||nx>890){state.vx*=-.2;nx=Math.max(430,Math.min(890,nx));state.melt+=1.5}
  if(ny<34||ny>648){state.vy*=-.2;ny=Math.max(34,Math.min(648,ny));state.melt+=1.5}
  for(const o of obstacles){if(collide(nx,ny,20,o)){state.vx*=-.25;state.vy*=-.25;nx=state.x;ny=state.y;if(state.hit<=0){state.melt+=5;state.hit=.7;showToast("CRASH · ICE MELTING")}}}
  state.hit=Math.max(0,state.hit-dt);state.x=nx;state.y=ny;
  state.timer=Math.max(0,state.timer-dt);state.melt=Math.min(99.9,state.melt+dt*.48+s*dt*.0035);
  if(s>30&&now-state.lastCube>95){state.lastCube=now;makeCube()}
  const t=targets[state.drop%targets.length];
  if(Math.hypot(state.x-t.x,state.y-t.y)<34){state.drop++;state.money+=50;state.ice=Math.max(0,state.ice-1);state.melt=Math.max(0,state.melt-5);showToast("ICE DELIVERED +$50");resetTarget()}
  if(state.timer<=0||state.melt>=99.8){showToast("LOAD MELTED · RELOAD PAGE");state.vx=state.vy=0}
  bike.style.left=(state.x-21)+"px";bike.style.top=(state.y-37)+"px";bike.style.transform="rotate("+state.angle+"rad)";
  const mm=String(Math.floor(state.timer/60)).padStart(2,"0"),ss=String(Math.floor(state.timer%60)).padStart(2,"0");
  timeEl.textContent="TIME: "+mm+":"+ss;iceEl.textContent="ICE LEFT: "+state.ice+"/8";meltEl.textContent="MELT: "+Math.floor(state.melt)+"%";moneyEl.textContent="$"+state.money;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
