<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c0d">
<title>Bangkok Ice Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c0d;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px #000}
#brand{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));font-size:20px;font-weight:1000;line-height:.82;letter-spacing:-1px}
#brand b{color:#ff4b3e}
#hud{position:absolute;left:14px;top:calc(62px + env(safe-area-inset-top));width:min(310px,72vw);font-size:10px;font-weight:900}
.row{display:flex;gap:8px;align-items:center;margin:5px 0}.bar{height:10px;flex:1;border:2px solid #fff;background:#111}.fill{height:100%;background:#8feaff}
#mission{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));max-width:52vw;text-align:right;font-size:10px;font-weight:900}.gold{color:#ffd14a}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle,rgba(18,20,20,.45),rgba(3,4,5,.94));z-index:10}
.card{width:min(500px,94vw);padding:24px;border:3px solid #f1e8d8;background:#111214;box-shadow:8px 8px #000;text-align:center}
.logo{font-size:clamp(38px,12vw,70px);font-weight:1000;line-height:.72;letter-spacing:-5px}.logo b{color:#ff4b3e}
.copy{font-size:12px;line-height:1.55;color:#d7d0c6;margin:20px auto;max-width:390px}
#start{width:100%;border:0;background:#ffd14a;padding:15px;font:1000 14px ui-monospace,monospace;letter-spacing:2px;box-shadow:4px 4px #8a6500}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
.pad{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto}
.btn{position:absolute;width:54px;height:54px;border:2px solid rgba(255,255,255,.75);background:rgba(8,8,9,.58);color:#fff;font:900 22px monospace;display:grid;place-items:center}
.btn.on{background:rgba(255,255,255,.25)}.u{left:48px}.d{left:48px;bottom:0}.l{left:0;top:48px}.r{right:0;top:48px}
#brake{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;border:3px solid #fff;background:rgba(255,75,62,.38);color:#fff;font:900 11px monospace;pointer-events:auto}
@media(pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="brand">BANGKOK<br><b>ICE RUN</b></div>
  <div id="hud">
    <div class="row"><span>ICE</span><div class="bar"><div id="ice" class="fill"></div></div><span id="iceN">100%</span></div>
    <div class="row"><span id="drops">0/3 DROPS</span><span style="margin-left:auto" id="spd">0 KM/H</span></div>
  </div>
  <div id="mission"><span class="gold">NEXT DROP</span><br><span id="dest">เยาวราช NIGHT MARKET</span></div>
</div>
<div id="touch">
  <div class="pad">
    <button class="btn u" data-k="ArrowUp">▲</button>
    <button class="btn d" data-k="ArrowDown">▼</button>
    <button class="btn l" data-k="ArrowLeft">◀</button>
    <button class="btn r" data-k="ArrowRight">▶</button>
  </div>
  <button id="brake">BRAKE</button>
</div>
<div id="overlay"><div class="card">
  <div class="logo">BANGKOK<br><b>ICE RUN</b></div>
  <div class="copy">Rainy Chinatown. Three deliveries. Shrines, alleys, traffic and the Chao Phraya. Your ice melts every second.</div>
  <button id="start">TAP TO RIDE</button>
</div></div>
<script>
(function(){
"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d");
const overlay=document.getElementById("overlay"),start=document.getElementById("start");
const iceBar=document.getElementById("ice"),iceN=document.getElementById("iceN"),drops=document.getElementById("drops"),spd=document.getElementById("spd"),dest=document.getElementById("dest");
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2),running=false,last=performance.now(),shake=0,dripClock=0;
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}addEventListener("resize",resize);resize();

const world={w:2200,h:1800};
const roads=[
{x:110,y:160,w:1900,h:150},{x:110,y:520,w:1600,h:150},{x:110,y:890,w:1800,h:150},{x:110,y:1270,w:1570,h:150},
{x:270,y:90,w:150,h:1510},{x:720,y:90,w:150,h:1510},{x:1180,y:90,w:150,h:1510},{x:1600,y:90,w:150,h:1330}
];
const missions=[
{x:1480,y:235,n:"เยาวราช NIGHT MARKET"},
{x:1665,y:960,n:"RIVERSIDE SHRINE"},
{x:1645,y:1345,n:"CHAO PHRAYA PIER"}
];
const cars=[
{x:305,y:225,a:0,s:62,c:"#f2df39"},{x:980,y:595,a:Math.PI,s:52,c:"#f05298"},
{x:790,y:1000,a:-Math.PI/2,s:48,c:"#4fbd69"},{x:1290,y:965,a:0,s:70,c:"#42aac8"},
{x:1665,y:560,a:Math.PI/2,s:45,c:"#d9433c"},{x:1200,y:1345,a:Math.PI,s:58,c:"#ed8c43"}
];
const p={x:345,y:1340,vx:0,vy:0,a:-Math.PI/2,ice:100,d:0,hit:0,trail:[]};
const keys={};

function onRoad(px,py,r=15){return roads.some(a=>px+r>a.x&&px-r<a.x+a.w&&py+r>a.y&&py-r<a.y+a.h)}
addEventListener("keydown",e=>{keys[e.key]=true;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll(".btn").forEach(b=>{
 const k=b.dataset.k,down=e=>{e.preventDefault();keys[k]=true;b.classList.add("on")},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove("on")};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
const brake=document.getElementById("brake");
brake.addEventListener("pointerdown",e=>{e.preventDefault();keys[" "]=true});
["pointerup","pointercancel"].forEach(t=>brake.addEventListener(t,e=>{e.preventDefault();keys[" "]=false}));

function reset(){Object.assign(p,{x:345,y:1340,vx:0,vy:0,a:-Math.PI/2,ice:100,d:0,hit:0});p.trail.length=0;updateHud()}
function go(e){if(e)e.preventDefault();reset();overlay.style.display="none";running=true;last=performance.now()}
start.addEventListener("click",go);
start.addEventListener("pointerup",go);

function finish(ok){running=false;overlay.style.display="grid";document.querySelector(".logo").innerHTML=ok?'ICE<br><b>DELIVERED</b>':'ALL<br><b>MELTED</b>';document.querySelector(".copy").textContent=ok?'Three drops complete with '+Math.round(p.ice)+'% ice left.':'The load melted before the final delivery.';start.textContent="RIDE AGAIN"}
function hit(){if(p.hit>0)return;p.hit=.65;p.ice=Math.max(0,p.ice-8);p.vx*=-.25;p.vy*=-.25;shake=8}
function updateHud(){iceBar.style.width=p.ice+"%";iceBar.style.background=p.ice<25?"#ff4b3e":p.ice<55?"#ffd14a":"#8feaff";iceN.textContent=Math.round(p.ice)+"%";drops.textContent=p.d+"/3 DROPS";spd.textContent=Math.round(Math.hypot(p.vx,p.vy)*.7)+" KM/H";dest.textContent=p.d<3?missions[p.d].n:"COMPLETE"}

function update(dt){
 if(!running)return;
 p.hit=Math.max(0,p.hit-dt);
 let ix=0,iy=0;if(keys.ArrowLeft||keys.a)ix--;if(keys.ArrowRight||keys.d)ix++;if(keys.ArrowUp||keys.w)iy--;if(keys.ArrowDown||keys.s)iy++;
 if(ix||iy){const m=Math.hypot(ix,iy);ix/=m;iy/=m;p.a=Math.atan2(iy,ix);const accel=keys[" "]?150:340;p.vx+=ix*accel*dt;p.vy+=iy*accel*dt}
 const drag=Math.pow(keys[" "]?.02:.15,dt);p.vx*=drag;p.vy*=drag;
 const max=keys[" "]?70:205,s=Math.hypot(p.vx,p.vy);if(s>max){p.vx=p.vx/s*max;p.vy=p.vy/s*max}
 const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
 if(onRoad(nx,p.y))p.x=nx;else hit();if(onRoad(p.x,ny))p.y=ny;else hit();

 cars.forEach(q=>{q.x+=Math.cos(q.a)*q.s*dt;q.y+=Math.sin(q.a)*q.s*dt;if(q.x<110)q.x=1980;if(q.x>2020)q.x=120;if(q.y<100)q.y=1460;if(q.y>1510)q.y=120;if(Math.abs(p.x-q.x)<28&&Math.abs(p.y-q.y)<28)hit()});

 p.ice=Math.max(0,p.ice-dt*.6);if(p.ice<=0){finish(false);return}
 dripClock+=dt;if(dripClock>.08){dripClock=0;p.trail.push({x:p.x-Math.cos(p.a)*18,y:p.y-Math.sin(p.a)*18,l:1});if(p.trail.length>90)p.trail.shift()}p.trail.forEach(t=>t.l-=dt*.13);

 if(p.d<3&&Math.hypot(p.x-missions[p.d].x,p.y-missions[p.d].y)<55){p.d++;p.ice=Math.min(100,p.ice+4);if(p.d===3){finish(true);return}}
 updateHud();
}
function camera(){return{x:Math.max(0,Math.min(world.w-W,p.x-W/2)),y:Math.max(0,Math.min(world.h-H,p.y-H/2))}}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function building(px,py,w,h,col,sign){
 rect(px,py,w,h,"#171719");rect(px+5,py+5,w-10,h-10,col);rect(px+12,py+14,w-24,14,"#292322");
 for(let yy=py+42;yy<py+h-18;yy+=30)for(let xx=px+15;xx<px+w-16;xx+=28)rect(xx,yy,12,8,"#e8c86d");
 rect(px+w*.14,py+h-24,w*.72,14,"#c83232");ctx.fillStyle="#ffd86d";ctx.font="bold 8px monospace";ctx.textAlign="center";ctx.fillText(sign,px+w/2,py+h-14);
}
function shrine(px,py){rect(px-35,py-24,70,48,"#7b2822");rect(px-28,py-18,56,35,"#d54d35");rect(px-20,py-28,40,10,"#e6b542");rect(px-13,py-37,26,9,"#f0d16e");rect(px-3,py-11,6,17,"#ffd95e");rect(px-18,py+4,36,5,"#67231e")}
function drawWorld(cx,cy){
 rect(-cx,-cy,world.w,world.h,"#1e221f");
 rect(1815-cx,-cy,385,1800,"#153c48");for(let yy=0;yy<1800;yy+=44)rect(1840-cx,yy-cy,250+(yy%88),3,"#2b6c7c");
 roads.forEach(r=>{rect(r.x-cx,r.y-cy,r.w,r.h,"#303234");rect(r.x-cx+6,r.y-cy+6,r.w-12,r.h-12,"#3a3c3e")});
 ctx.strokeStyle="#b4a45d";ctx.globalAlpha=.32;ctx.lineWidth=2;ctx.setLineDash([22,22]);
 roads.forEach(r=>{ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x-cx,r.y+r.h/2-cy);ctx.lineTo(r.x+r.w-cx,r.y+r.h/2-cy)}else{ctx.moveTo(r.x+r.w/2-cx,r.y-cy);ctx.lineTo(r.x+r.w/2-cx,r.y+r.h-cy)}ctx.stroke()});ctx.setLineDash([]);ctx.globalAlpha=1;

 building(455-cx,320-cy,220,150,"#703b34","金龍");building(900-cx,330-cy,235,150,"#62533b","ยา");building(1370-cx,330-cy,190,155,"#3f5050","HOTEL");
 building(450-cx,700-cy,220,155,"#554038","SEAFOOD");building(890-cx,700-cy,240,160,"#6c2e34","เยาวราช");building(1370-cx,700-cy,190,150,"#4f3430","TEA");
 building(440-cx,1070-cy,230,160,"#414c43","CAFE");building(900-cx,1070-cy,240,165,"#6d4931","GOLD");building(1365-cx,1070-cy,190,160,"#4f424d","MASSAGE");
 building(450-cx,1450-cy,220,180,"#533933","NOODLE");building(900-cx,1450-cy,240,170,"#394b50","ICE");
 shrine(1690-cx,770-cy);shrine(1510-cx,1160-cy);
 rect(1745-cx,1290-cy,120,100,"#6a5237");for(let i=0;i<5;i++)rect(1760+i*22-cx,1305-cy,6,70,"#a98755");
 for(let i=0;i<9;i++){const sx=1360+(i%5)*75,sy=170+Math.floor(i/5)*72;rect(sx-cx,sy-cy,58,36,i%2?"#b43934":"#295f61");rect(sx+5-cx,sy+29-cy,48,4,"#e6bf57")}
 ctx.globalAlpha=.28;for(let i=0;i<32;i++){const px=150+(i*173)%1550,py=190+(i*257)%1260;rect(px-cx,py-cy,25+(i%4)*12,5,"#78b6c7")}ctx.globalAlpha=1;
}
function drawBike(px,py,a){
 ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);if(p.hit>0&&Math.floor(p.hit*15)%2)ctx.globalAlpha=.35;
 rect(-5,-26,10,12,"#111");rect(-6,14,12,13,"#111");rect(-9,-18,18,37,"#d9d7d0");rect(-7,-7,14,18,"#e44b40");rect(-6,2,12,14,"#292727");
 rect(-11,-11,22,8,"#242527");rect(-7,-25,14,8,"#e7e1cf");rect(-8,-2,16,10,"#25454e");
 rect(-8,-9,16,15,"#25262b");rect(-6,-8,12,5,"#b8d5dc");
 rect(-13,9,26,17,"#b9ecf5");rect(-11,11,22,13,"#d7f8ff");rect(-8,15,16,3,"#62c7df");ctx.restore();
}
function drawCar(q,cx,cy){ctx.save();ctx.translate(q.x-cx,q.y-cy);ctx.rotate(q.a);rect(-17,-10,34,20,"#111");rect(-14,-8,28,16,q.c);rect(-7,-6,10,12,"#bad9dc");rect(7,-6,5,12,"#222");ctx.restore()}
function draw(){
 const cc=camera(),sx=cc.x+(shake?(Math.random()-.5)*shake:0),sy=cc.y+(shake?(Math.random()-.5)*shake:0);shake*=.82;
 ctx.clearRect(0,0,W,H);drawWorld(sx,sy);
 p.trail.forEach(t=>{ctx.globalAlpha=Math.max(0,t.l)*.45;rect(t.x-cc.x-2,t.y-cc.y-2,4,4,"#9fefff")});ctx.globalAlpha=1;
 if(p.d<3){const m=missions[p.d],dx=m.x-cc.x,dy=m.y-cc.y,rr=25+Math.sin(performance.now()/150)*5;ctx.strokeStyle="#ffd14a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(dx,dy,rr,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#ffd14a";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.fillText("DROP",dx,dy-34)}
 cars.forEach(q=>drawCar(q,cc.x,cc.y));drawBike(p.x-cc.x,p.y-cc.y,p.a);
 ctx.globalAlpha=.16;ctx.strokeStyle="#b7e9ff";for(let i=0;i<65;i++){const rx=(i*83+performance.now()*.05)%W,ry=(i*137+performance.now()*.13)%H;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+11);ctx.stroke()}ctx.globalAlpha=1;
 const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.35)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
